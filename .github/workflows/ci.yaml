name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Lint, Unit tests, Build check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lock file
        run: uv sync --locked

      - name: Lint
        run: uv run --locked flake8 app tests

      - name: Unit tests with coverage gate
        run: uv run --locked pytest tests/unit

      - name: Build
        run: uv run --locked python -m compileall -q app

  integration-tests:
    name: Integration tests (Testcontainers)
    needs: [quality]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lock file
        run: uv sync --locked

      - name: Run integration tests in parallel
        run: uv run --locked pytest tests/integration -n auto --no-cov

  docker-image:
    name: Docker image build, scan, publish
    needs: [integration-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image name and commit tag
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image with layer cache
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Trivy
        id: trivy-setup
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.1
          cache: true

      - name: Generate full vulnerability report
        if: ${{ always() && steps.image-build.outcome == 'success' && steps.trivy-setup.outcome == 'success' }}
        run: >-
          trivy image --image-src docker --scanners vuln
          --format table --exit-code 0 --output trivy-report.txt
          "${IMAGE_NAME}:${SHORT_SHA}"

      - name: Generate CycloneDX SBOM
        if: ${{ always() && steps.image-build.outcome == 'success' && steps.trivy-setup.outcome == 'success' }}
        run: >-
          trivy image --image-src docker --format cyclonedx
          --output sbom.cdx.json "${IMAGE_NAME}:${SHORT_SHA}"

      - name: Trivy vulnerability gate
        run: >-
          trivy image --image-src docker --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          "${IMAGE_NAME}:${SHORT_SHA}"

      - name: Upload full Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CycloneDX SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Log in to GHCR
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image to GHCR
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker push "${IMAGE_NAME}:${SHORT_SHA}"

  promote-to-staging:
    name: Promote image to staging registry
    needs: [docker-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}" |
          skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Copy image to staging namespace
        run: >-
          skopeo copy
          docker://ghcr.io/wonderfau1t/thi:${GITHUB_SHA::7}
          docker://ghcr.io/wonderfau1t/thi-staging:${GITHUB_SHA::7}

  update-manifest:
    name: Update staging Kubernetes manifest
    needs: [promote-to-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag and commit
        run: |
          TAG=${GITHUB_SHA::7}
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/wonderfau1t/thi-staging:${TAG}\"" k8s-manifests/staging/deployment.yaml
          git config user.email "ci-bot@example.com"
          git config user.name "CI Bot"
          git add k8s-manifests/staging/deployment.yaml
          git commit -m "Deploy ${TAG} to staging"
          git push